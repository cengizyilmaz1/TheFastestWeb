# Application processes only; PostgreSQL and Redis are separate Coolify Resources.
x-job-environment: &job-environment
  NODE_ENV: production
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-production}
  SITE_URL: ${SITE_URL:-https://thefastestweb.site}
  SITE_NAME: ${SITE_NAME:-TheFastestWeb}
  SITE_EMAIL: ${SITE_EMAIL:-}
  DATABASE_URL: ${DATABASE_URL:?Set the least-privilege application database URL}
  REDIS_URL: ${REDIS_URL:?Set the authenticated private Redis URL}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-tfw}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-10}
  DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-10}
  DB_IDLE_TIMEOUT_SECONDS: ${DB_IDLE_TIMEOUT_SECONDS:-20}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
  PSI_REQUESTS_PER_MINUTE: ${PSI_REQUESTS_PER_MINUTE:-10}
  PSI_REQUESTS_PER_DAY: ${PSI_REQUESTS_PER_DAY:-1000}
  JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

x-provider-environment: &provider-environment
  PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-false}
  DODO_ENVIRONMENT: ${DODO_ENVIRONMENT:-test_mode}
  DODO_API_KEY: ${DODO_API_KEY:-}
  DODO_WEBHOOK_SECRET: ${DODO_WEBHOOK_SECRET:-}
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  M365_TENANT_ID: ${M365_TENANT_ID:-}
  M365_CLIENT_ID: ${M365_CLIENT_ID:-}
  M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
  M365_SENDER: ${M365_SENDER:-}
  EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
  STORAGE_ENABLED: ${STORAGE_ENABLED:-false}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
  R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
  SCREENSHOTS_ENABLED: ${SCREENSHOTS_ENABLED:-false}
  SCREENSHOT_CLIENT_ID: ${SCREENSHOT_CLIENT_ID:-thefastestweb}
  SCREENSHOT_SERVICE_URL: ${SCREENSHOT_SERVICE_URL:-}
  SCREENSHOT_SERVICE_TOKEN: ${SCREENSHOT_SERVICE_TOKEN:-}

x-analytics-environment: &analytics-environment
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
  GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
  DATAFAST_WEBSITE_ID: ${DATAFAST_WEBSITE_ID:-}
  DATAFAST_DOMAIN: ${DATAFAST_DOMAIN:-}
  DATAFAST_API_KEY: ${DATAFAST_API_KEY:-}

x-runtime-logging: &runtime-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 512
    logging: *runtime-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:${TFW_CHROMIUM_SECCOMP_PROFILE:?Set the artifact-absolute Chromium seccomp profile path}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      <<: [*job-environment, *provider-environment, *analytics-environment]
      AUTH_SECRET: ${AUTH_SECRET:?Generate a new auth secret}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_URL: ${AUTH_URL:-}
      AUTH_TRUST_HOST: "true"
      GOOGLE_PSI_API_KEY: ${GOOGLE_PSI_API_KEY:-}
      GOOGLE_PSI_API_KEY_BACKUP: ${GOOGLE_PSI_API_KEY_BACKUP:-}
      UNAVATAR_API_KEY: ${UNAVATAR_API_KEY:-}
      DATAFAST_BOT_TRACKING_ENABLED: ${DATAFAST_BOT_TRACKING_ENABLED:-false}
      DATAFAST_BOT_TOKEN: ${DATAFAST_BOT_TOKEN:-}
      DATAFAST_BOT_TRUSTED_IP_HEADER: ${DATAFAST_BOT_TRUSTED_IP_HEADER:-none}
      SEARCH_CONSOLE_VERIFICATION: ${SEARCH_CONSOLE_VERIFICATION:-}
      BING_VERIFICATION: ${BING_VERIFICATION:-}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      INDIETOOLS_URL: ${INDIETOOLS_URL:-}
    expose: ["3000"]
    networks: [default, backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    logging: *runtime-logging
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:${TFW_CHROMIUM_SECCOMP_PROFILE:?Set the artifact-absolute Chromium seccomp profile path}
    build:
      context: .
      dockerfile: Dockerfile
      target: jobs-runner
    environment:
      <<: [*job-environment, *provider-environment, *analytics-environment]
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-3001}
      GOOGLE_PSI_API_KEY: ${GOOGLE_PSI_API_KEY:-}
      GOOGLE_PSI_API_KEY_BACKUP: ${GOOGLE_PSI_API_KEY_BACKUP:-}
    command: ["node", "dist/jobs/worker.cjs"]
    expose: ["3001"]
    networks: [default, backend]
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 160s

  scheduler:
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    logging: *runtime-logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: Dockerfile
      target: jobs-runner
    environment:
      <<: *job-environment
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      SCHEDULER_HEALTH_PORT: ${SCHEDULER_HEALTH_PORT:-3002}
    command: ["node", "dist/jobs/scheduler.cjs"]
    expose: ["3002"]
    networks: [backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.SCHEDULER_HEALTH_PORT+'/health/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 160s

networks:
  backend:
    external: true
    name: ${TFW_BACKEND_NETWORK:?Set the private managed database network}
