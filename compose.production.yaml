# Opt in after compose.managed.yaml and compose.coolify.yaml. The base routing
# overlay serves the canonical TFW_PUBLIC_HOST. This adds www and preview only.
# No service, network, build argument, port or provider credential is added.
services:
  web:
    environment:
      TFW_PREVIEW_HOST: ${TFW_PREVIEW_HOST:?Set the retained demo hostname for production preview}
    labels:
      # Both www schemes go straight to the canonical HTTPS origin. The router
      # binds the source host; the regex preserves the complete path and query.
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-http.entrypoints=http
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-http.rule=Host(`www.${TFW_PUBLIC_HOST:?Set the canonical apex hostname}`)
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-http.service=tfw-${TFW_COOLIFY_NETWORK}
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-http.middlewares=tfw-${TFW_COOLIFY_NETWORK}-canonical
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-https.entrypoints=https
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-https.rule=Host(`www.${TFW_PUBLIC_HOST:?Set the canonical apex hostname}`)
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-https.service=tfw-${TFW_COOLIFY_NETWORK}
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-https.middlewares=tfw-${TFW_COOLIFY_NETWORK}-canonical
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-https.tls=true
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-www-https.tls.certresolver=letsencrypt
      - traefik.http.middlewares.tfw-${TFW_COOLIFY_NETWORK}-canonical.redirectregex.regex=^https?://[^/]+/(.*)
      - traefik.http.middlewares.tfw-${TFW_COOLIFY_NETWORK}-canonical.redirectregex.replacement=https://${TFW_PUBLIC_HOST}/$${1}
      - traefik.http.middlewares.tfw-${TFW_COOLIFY_NETWORK}-canonical.redirectregex.permanent=true

      # The existing demo remains a distinct preview host. Apply noindex at the
      # proxy as well, including redirects and responses generated by the app.
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-http.entrypoints=http
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-http.rule=Host(`${TFW_PREVIEW_HOST:?Set the retained demo hostname for production preview}`)
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-http.service=tfw-${TFW_COOLIFY_NETWORK}
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-http.middlewares=tfw-${TFW_COOLIFY_NETWORK}-preview-noindex,tfw-${TFW_COOLIFY_NETWORK}-https
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-https.entrypoints=https
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-https.rule=Host(`${TFW_PREVIEW_HOST:?Set the retained demo hostname for production preview}`)
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-https.service=tfw-${TFW_COOLIFY_NETWORK}
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-https.middlewares=tfw-${TFW_COOLIFY_NETWORK}-preview-noindex
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-https.tls=true
      - traefik.http.routers.tfw-${TFW_COOLIFY_NETWORK}-preview-https.tls.certresolver=letsencrypt
      - traefik.http.middlewares.tfw-${TFW_COOLIFY_NETWORK}-preview-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, follow, noarchive
