name: Application and infrastructure validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: tfw_test_ci
          # Ephemeral runner-only test data. Never use trust authentication in production.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tfw_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/tfw_test_ci
      NEXT_TELEMETRY_DISABLED: "1"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Create isolated Redis test credentials
        shell: bash
        run: |
          redis_password="$(openssl rand -hex 32)"
          echo "::add-mask::$redis_password"
          printf 'REDIS_PASSWORD=%s\nREDIS_TEST_URL=redis://:%s@127.0.0.1:6379/15\n' \
            "$redis_password" "$redis_password" >> "$GITHUB_ENV"
      - name: Start authenticated persistent Redis fixture
        shell: bash
        run: |
          docker build --target redis -t tfw-ci-redis .
          docker run --detach --name tfw-ci-redis \
            --publish 127.0.0.1:6379:6379 --env REDIS_PASSWORD \
            --health-cmd 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --raw ping | grep -qx PONG' \
            --health-interval 2s --health-timeout 2s --health-retries 10 tfw-ci-redis
          for attempt in $(seq 1 20); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' tfw-ci-redis)" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo 'Redis fixture did not become healthy.' >&2
          exit 1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm audit
      - run: npm run build
      - run: npm run build:jobs
      - name: Install browser for accessibility and runtime checks
        run: npx playwright install --with-deps chromium
      - name: Verify production runtime with isolated data
        run: npx tsx scripts/public-runtime-smoke.ts
      - name: Remove disposable Redis fixture
        if: always()
        run: docker rm --force --volumes tfw-ci-redis || true
